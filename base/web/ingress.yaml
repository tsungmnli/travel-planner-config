apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-tsungmn"
spec:
  tls:
    - hosts:
        - sth.travel.tsungmn.com
      secretName: gitops-tls
  rules:
    - host: sth.travel.tsungmn.com
      http:
        paths:
          - backend:
              service:
                name: web-service
                port:
                  number: 80
            path: /
            pathType: Prefix
